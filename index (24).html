<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#0f1d4a}

<title>六浦祭フロアマップ</title>
<script>(function(){if(!document.querySelector('meta[name="viewport"]')){var m=document.createElement('meta');m.name='viewport';m.content='width=device-width, initial-scale=1, viewport-fit=cover';document.head.appendChild(m);}})();</script>

<style>
/* Layout: festival sky header → island map (sea, grass, buildings, tents) filling the screen, with a guide panel at the right on PC and a draggable bottom sheet on phones.
   Palette from the 2026 poster: navy sky, sunset orange title, deep bay blue, AMBITIOUS white, 2026 green. Single daytime look by design. */
:root{
  color-scheme:light;
  --ink:#1a1840; --muted:#5d5b7c; --paper:#fffaf2; --card:#ffffff; --line:#e3dccd;
  --sky:#0f1d4a; --sky2:#243f8f; --sunset:#ff5a2e; --sunset2:#ff9b3d; --magenta:#e2457d; --gold:#ffc531; --green:#3fae3a;
  --sea:#1f57b8; --sea2:#2f74d6; --foam:#9cc8ff; --grass:#a6d67e; --grass2:#8cc565; --tree:#4f9b45; --sand:#f6e1ad; --sand2:#ecc97e;
  --play:#ff4f8b; --eat:#ff7a1a; --see:#2f7bff; --intro:#12b39a; --info:#f2b705;
  --wcm:#2f7bff; --wcf:#ff4f8b;
  --r-hs:#ff8aa0; --r-b2:#ffc94d; --r-jh:#5fcf8c; --r-b4:#a88bfa; --r-rei:#ff9a55; --r-hk:#b7c3d4; --r-naka:#f6e1ad;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --peek:178px;
}
html,body{height:100%;overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-weight:700;font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sky)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.app{height:100%;min-height:560px;min-height:max(100svh,560px);display:grid;grid-template-rows:auto minmax(0,1fr)}

/* ---------- header ---------- */
.top{position:relative;z-index:20;color:#fff;overflow:hidden;
  background:linear-gradient(100deg,var(--sky) 0%,var(--sky2) 55%,#7a3a8c 82%,var(--sunset) 120%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(circle at 12% 30%,#fff 0 1.2px,transparent 1.6px),radial-gradient(circle at 63% 70%,#fff 0 1px,transparent 1.4px),radial-gradient(circle at 38% 18%,#ffd 0 1px,transparent 1.4px);
  background-size:120px 60px,170px 70px,90px 50px}
.top-in{position:relative;z-index:1;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.logo h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1;color:var(--sunset);
  text-shadow:0 2px 0 #7a1f0a, 0 0 18px rgba(255,90,46,.45);letter-spacing:.04em}
.home{all:unset;cursor:pointer;font:inherit;color:inherit;text-shadow:inherit}
.home:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.logo .meta{display:flex;flex-direction:column;line-height:1.25}
.logo .meta b{font-size:12px;letter-spacing:.08em;opacity:.9}
.logo .meta span{font-family:var(--f-display);font-size:14px;letter-spacing:.02em}
.amb{font-family:var(--f-display);font-size:11px;letter-spacing:.22em;padding:3px 8px 3px 10px;border:1.5px solid #fff;border-radius:4px;transform:skewX(-8deg)}
.amb em{font-style:normal;color:#7ee07a;margin-left:6px;letter-spacing:.05em}
.count{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 12px 4px 6px;font-size:13px;white-space:nowrap}
.count i{width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--sky);display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-size:11px}
.count b{font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--gold);margin:0 1px}
.langbtn{margin-left:auto;border:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:999px;padding:5px 12px;font-weight:800;font-size:12.5px;letter-spacing:.06em}
.langbtn:hover{background:rgba(255,255,255,.15)}
.views{margin-left:8px;display:flex;gap:3px;background:rgba(0,0,0,.25);padding:4px;border-radius:999px}
.views button{border:0;background:transparent;color:#fff;padding:6px 14px;border-radius:999px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px;transition:background .2s,color .2s}
.views button svg{width:16px;height:16px}
.views button[aria-pressed="true"]{background:#fff;color:var(--sky)}
@media (max-width:760px){
  .logo h1{font-size:24px}.logo .meta b{display:none}.amb{display:none}.count{display:none}
  .place{padding:4px 12px 4px 6px;border-radius:12px}.place .sw{width:28px;height:28px;font-size:11px}.place h2{font-size:15px}.place p{font-size:10.5px}
  .views{margin-left:auto}.views button{padding:6px 10px}.views button span{display:none}
  .top-in{gap:8px 10px}
}

/* ---------- main ---------- */
.main{position:relative;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px;transition:grid-template-columns .3s}
.main.collapsed{grid-template-columns:minmax(0,1fr) 0px}
.main.collapsed .panel{border-left-width:0;overflow:hidden;visibility:hidden}
.gtoggle{position:absolute;top:12px;right:12px;z-index:6;border:2.5px solid var(--ink);background:var(--card);border-radius:12px;padding:6px 12px;font-weight:800;font-size:13px;box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;gap:6px;padding-right:max(12px,env(safe-area-inset-right,0px))}
.gtoggle:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
@media (max-width:960px){.gtoggle{display:none}}
@media (max-width:960px){.main{grid-template-columns:minmax(0,1fr)}}

.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--sea)}
.stage.floor{background:#f3ecdf;background-image:radial-gradient(circle,#e2d8c4 1.2px,transparent 1.6px);background-size:22px 22px}
.vp{position:absolute;inset:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
@media (max-width:960px){.vp{bottom:calc(var(--peek) - 18px)}.main.sheet-off .vp{bottom:0}.main.sheet-off .mfit{bottom:calc(16px + env(safe-area-inset-bottom,0px))}}
.vp.drag{cursor:grabbing}
.vp svg{width:100%;height:100%;display:block}
.vp svg.enter{animation:enter .55s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}

.overlay-top{position:absolute;top:12px;left:12px;right:12px;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:5;
  padding-left:env(safe-area-inset-left,0px)}
.overlay-top > *{pointer-events:auto}
.stage:not(.floor) .place,.stage:not(.floor) .hint{display:none}
.place{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:6px 14px 6px 8px;box-shadow:0 4px 0 var(--ink);max-width:100%}
.place .sw{width:34px;height:34px;border-radius:10px;background:var(--c);border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;flex:0 0 auto}
.place h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.15}
.place p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.3}
.btabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.btabs::-webkit-scrollbar{display:none}
.btabs button{flex:0 0 auto;border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:4px 12px 4px 6px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--ink);transition:transform .15s}
.btabs button i{width:16px;height:16px;border-radius:50%;background:var(--c);border:1.5px solid var(--ink)}
.btabs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.btabs button:active{transform:translateY(2px)}
.btabs .fsep{flex:0 0 auto;width:2px;align-self:stretch;margin:4px 4px;background:var(--line);border-radius:2px}
.btabs .flb,.mfloors .flb{position:relative;width:38px;height:38px;min-width:0!important;padding:0!important;border-radius:50%!important;border:0!important;box-shadow:none!important;color:#fff!important;font-family:'Helvetica Neue',Arial,sans-serif!important;font-weight:700!important;font-size:15px!important;letter-spacing:-.02em;background:var(--bc,#0039a6)!important;display:grid;place-items:center;opacity:.55;transition:transform .15s,opacity .15s}
.flb[data-fi="0"]{--bc:#ee352e}.flb[data-fi="1"]{--bc:#00933c}.flb[data-fi="2"]{--bc:#0039a6}.flb[data-fi="3"]{--bc:#ff6319}
.btabs .flb[aria-pressed="true"],.mfloors .flb[aria-pressed="true"]{opacity:1;transform:scale(1.12);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--bc)!important}

.flb b{position:absolute;top:-8px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);border:2px solid var(--ink);font-family:var(--f-body);font-size:10.5px;line-height:14px;padding:0 3px;box-sizing:border-box;color:var(--ink)}
.mfloors{display:none}
.pchips{display:none}
@media (max-width:960px){.pchips{display:block;padding:2px max(16px,env(safe-area-inset-left,0px)) 8px;border-bottom:2px dashed var(--line)}.pchips .chips{padding-bottom:2px}}
.btabs .backbtn{background:var(--sunset);color:#fff;padding:6px 16px;font-size:14px}
.btabs .backbtn span{font-size:16px}
.btabs button em{font-style:normal;background:var(--sunset);color:#fff;border-radius:999px;padding:0 6px;font-size:11px}

.rail{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column-reverse;gap:8px;z-index:5;padding-right:env(safe-area-inset-right,0px)}
@media (max-width:960px){
  .rail{top:auto;transform:none;bottom:calc(var(--peek) + 6px);left:12px;right:auto;flex-direction:row;padding-left:env(safe-area-inset-left,0px)}
  .rail button{width:46px;height:40px;font-size:14px;border-radius:12px}
  .stage.floor .place{display:none}
  .overlay-top{top:8px;left:8px;right:8px}
}
.rail button{width:52px;height:48px;border:2.5px solid var(--ink);background:var(--card);border-radius:14px;font-family:var(--f-display);font-size:16px;position:relative;box-shadow:0 4px 0 var(--ink);transition:transform .15s,background .2s}
.rail button[aria-pressed="true"]{background:var(--sunset);color:#fff}
.rail button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.rail button b{position:absolute;top:-8px;left:-8px;min-width:20px;height:20px;border-radius:10px;background:var(--gold);border:2px solid var(--ink);font-family:var(--f-body);font-size:11px;line-height:16px;padding:0 4px;box-sizing:border-box;color:var(--ink)}
.zoom{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:5}
@media (max-width:960px){.zoom{display:none}}
.zoom button{width:40px;height:40px;border:2.5px solid var(--ink);background:var(--card);border-radius:12px;font-weight:800;font-size:18px;line-height:1;box-shadow:0 3px 0 var(--ink)}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(26,24,64,.82);color:#fff;font-size:12px;padding:6px 12px;border-radius:999px;z-index:5;white-space:nowrap;pointer-events:none;transition:opacity .4s}
@media (max-width:960px){.hint{bottom:auto;top:64px}}

/* ---------- guide panel ---------- */
.panel{position:relative;z-index:10;background:var(--paper);border-left:3px solid var(--ink);display:flex;flex-direction:column;min-height:0}
.handle{display:none}
@media (max-width:960px){
  .panel{position:absolute;left:0;right:0;bottom:0;height:88%;border-left:0;border-top:3px solid var(--ink);border-radius:22px 22px 0 0;
    box-shadow:0 -8px 30px rgba(10,10,40,.35);transform:translateY(calc(100% - var(--peek)));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  .panel[data-s="hidden"]{transform:translateY(105%);box-shadow:none}
  .panel[data-s="half"]{transform:translateY(48%)}
  .panel[data-s="full"]{transform:translateY(0)}
  .panel.dragging{transition:none}
  .handle{display:block;border:0;background:transparent;width:100%;padding:10px 0 4px;touch-action:none}
  .handle span{display:block;margin:0 auto;width:48px;height:5px;border-radius:3px;background:var(--line)}
}
.p-head{padding:12px 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:2px dashed var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:960px){
  .p-head{padding-top:2px;gap:8px;padding-bottom:8px}
  :root{--peek:146px}
  .search input{padding-block:9px}
  .hint{display:none}
  .place{display:none}
}
.search{position:relative}
.search input{width:100%;box-sizing:border-box;padding:11px 14px 11px 42px;border:2.5px solid var(--ink);border-radius:14px;background:var(--card);font-size:16px;font-weight:700}
.search input::placeholder{color:#9a97b3}
.search input:focus{outline:none;box-shadow:0 0 0 4px rgba(255,197,49,.6)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:19px;height:19px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:4px 11px 4px 5px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:6px;transition:transform .15s,background .2s}
.chip .ic{width:22px;height:22px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff}
.chip .ic svg{width:14px;height:14px}
.chip[aria-pressed="true"]{background:var(--c);color:#fff;animation:chipPop .35s cubic-bezier(.2,.9,.3,1.6)}
@keyframes chipPop{0%{transform:scale(.9)}100%{transform:none}}
.chip:active{transform:scale(.94)}
.steam path{fill:none;stroke:rgba(255,255,255,.85);stroke-width:4;stroke-linecap:round;animation:steam 2.6s ease-in-out infinite;animation-delay:calc(var(--d,0) * -.4s)}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}30%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}
.spark{transform-box:fill-box;transform-origin:center;animation:spark 2.4s ease-in-out infinite;animation-delay:calc(var(--d,0) * -.5s)}
@keyframes spark{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.attm .pn{animation:pinIdle 3.2s ease-in-out infinite}
.attm[data-i$="1"] .pn,.attm[data-i$="4"] .pn,.attm[data-i$="7"] .pn{animation-delay:-1.1s}
.attm[data-i$="2"] .pn,.attm[data-i$="5"] .pn,.attm[data-i$="8"] .pn{animation-delay:-2.2s}
@keyframes pinIdle{0%,100%{translate:0 0}50%{translate:0 -3px}}
.it{animation:itIn .35s ease-out both}
@keyframes itIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel[data-s] .ticket .num{animation:numSpin .6s cubic-bezier(.2,.9,.3,1.3)}
@keyframes numSpin{from{transform:rotate(-180deg) scale(.4)}to{transform:none}}
.chip[aria-pressed="true"] .ic{background:#fff;color:var(--c)}
.chip.fac{padding:4px 10px 4px 4px}
.chip.fac .ic{border-radius:7px}
.p-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:12px 16px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px))}

.poster{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center;background:var(--sky);color:#fff;border-radius:16px;padding:10px;margin-bottom:14px;border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.poster img{width:96px;height:136px;object-fit:cover;border-radius:10px;display:block}
.poster h3{margin:0;font-family:var(--f-display);font-weight:400;color:var(--sunset);font-size:24px;line-height:1.1}
.poster p{margin:4px 0 0;font-size:13px;line-height:1.5}
.poster .d{font-family:var(--f-display);font-size:17px;color:#fff}
.poster .d small{font-family:var(--f-body);font-size:12px;opacity:.8}
.poster .t{display:inline-block;margin-top:6px;background:var(--gold);color:var(--sky);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800}

.l-title{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 6px}
.l-title h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:17px}
.l-title span{font-size:12px;color:var(--muted)}
.sec{display:flex;align-items:center;gap:8px;margin:14px 0 6px;font-size:13px;font-weight:800;color:var(--c,var(--muted))}
.sec::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--c,var(--line)) 0 6px,transparent 6px 11px);opacity:.5}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.it{width:100%;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:2px solid transparent;background:var(--card);border-radius:14px;padding:7px 10px 7px 7px;transition:border-color .15s,transform .15s}
.it:hover{border-color:var(--ink);transform:translateX(2px)}
.it[aria-current="true"]{border-color:var(--ink);background:#fff6d9}
.num{width:36px;height:36px;border-radius:50%;background:var(--c);border:2.5px solid var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:14px}
.num svg{width:18px;height:18px}
.num.sq{border-radius:10px}
.num.tbd{background:repeating-linear-gradient(45deg,#ece6d8 0 5px,#fff 5px 10px);color:var(--muted)}
.it .nm{font-size:14.5px;line-height:1.3;min-width:0}
.it .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.by{display:block;width:max-content;max-width:100%;margin-top:2px;font-size:11.5px;font-weight:800;font-style:italic;letter-spacing:.02em;color:var(--sky2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ticket .band .by{color:#fff;background:rgba(0,0,0,.18);border-radius:999px;padding:2px 10px;margin-top:6px;font-size:12.5px}

/* ticket detail */

/* ---------- svg ---------- */

@keyframes beam{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}
.train{animation:train 14s ease-in-out infinite}
@keyframes train{0%,8%{transform:translateX(0)}46%,58%{transform:translateX(var(--tl,410px))}96%,100%{transform:translateX(0)}}
.wing{transform-box:fill-box;transform-origin:50% 100%;animation:flap .9s ease-in-out infinite}

.attm .pn em{position:absolute;top:-9px;right:-12px;min-width:20px;height:20px;border-radius:10px;background:var(--c);color:#fff;font-style:normal;font-family:var(--f-display);font-size:11px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff;box-sizing:border-box}
.attm .lb{margin-top:12px;background:rgba(255,255,255,.96);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;white-space:nowrap;box-shadow:0 2px 6px rgba(20,20,60,.25);max-width:130px;overflow:hidden;text-overflow:ellipsis}
.attm:hover .pn,.attm.on .pn{transform:scale(1.12)}
.attm.sel .pn{background:var(--c);color:#fff;transform:scale(1.25)}
.attm.sel{z-index:3}
.attm.dim,.bldm.dim{opacity:.3}
.mks.anim .attm .pn{animation:drop .55s cubic-bezier(.2,.9,.3,1.4) .2s both, pinIdle 3.2s ease-in-out .8s infinite}
@keyframes drop{from{opacity:0;transform:translateY(-26px) scale(.6)}to{opacity:1;transform:none}}
.attm.sel .pn{animation:bounce 1s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:scale(1.25) translateY(0)}50%{transform:scale(1.25) translateY(-6px)}}
.far .attm .lb{display:none}
.vfar .attm .pn{width:30px;height:30px;border-width:2.5px}
.vfar .attm .pn svg{width:17px;height:17px}
.vfar .attm .pn em{min-width:17px;height:17px;font-size:9.5px;top:-7px;right:-9px}
.vfar .attm{translate:-50% -42px}
.vfar .bldm{padding:3px 8px 3px 5px;border-radius:10px}
.vfar .bldm b{font-size:12px}
.vfar .bldm em{font-size:10px;padding:0 5px}
.vfar .aream{display:none}
.bldm{display:flex;align-items:center;gap:6px;translate:-50% -50%;background:rgba(255,255,255,.96);border-radius:14px;padding:5px 10px 5px 7px;box-shadow:0 4px 12px rgba(20,20,60,.3);white-space:nowrap}
.bldm.vert{flex-direction:column;gap:5px;padding:8px 5px 6px}
.bldm.vert b{display:block;text-align:center;line-height:1.08;white-space:normal}
.bldm .tap{display:inline-grid;place-items:center;height:20px;padding:0 6px;margin-left:1px;background:#FFD23F;color:#1b2a5e;font:900 10.5px/1 system-ui,sans-serif;letter-spacing:.04em;border-radius:999px;box-shadow:0 1px 0 #d9a400,0 0 0 1.5px #fff inset;animation:tapNudge 1.8s ease-in-out infinite}
.bldm .tap svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;animation:tapPress 1.8s ease-in-out infinite;transform-origin:50% 90%}
@keyframes tapNudge{0%,100%{box-shadow:0 0 0 0 rgba(255,90,46,.55)}50%{box-shadow:0 0 0 6px rgba(255,90,46,0)}}
@keyframes tapPress{0%,60%,100%{transform:none}70%{transform:translateY(2px) scale(.88)}80%{transform:none}}
.bldm.single .st{font-size:11.5px;font-weight:800;color:#fff;background:var(--c);border-radius:999px;padding:2px 9px}
.bldm.single.sel{outline:3px solid var(--sunset);outline-offset:2px}
.vfar .bldm .tap{height:17px;padding:0 5px;font-size:9.5px}
.vfar .bldm .tap svg{width:12px;height:12px}
.vfar .bldm.single .st{display:none}
.bldm i{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}
.bldm b{font-family:var(--f-display);font-weight:400;font-size:15px}
.bldm em{font-style:normal;background:var(--sky2);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:800}
.bldm em.hitc{background:var(--sunset)}
.bldm small{font-size:11px;color:var(--muted)}
.bldm.closed{cursor:default;background:rgba(255,255,255,.55);box-shadow:none;padding:3px 9px;opacity:.75}
.bldm.closed b{font-size:12.5px;color:var(--muted)}
.aream{translate:-50% -50%;background:var(--sunset);color:#fff;border-radius:10px;padding:4px 12px;box-shadow:0 4px 10px rgba(20,20,60,.3);display:flex;flex-direction:column;align-items:center;line-height:1.2}
.aream b{font-family:var(--f-display);font-weight:400;font-size:15px}
.aream small{font-size:10.5px;opacity:.95}
.far .bldm small:not(.keep),.far .aream small{display:none}

.foam{animation:foam 7s linear infinite}
@keyframes foam{to{stroke-dashoffset:-64}}
@media (prefers-reduced-motion:reduce){.mks .attm .pn{animation:none!important}}

/* ---------- オープニング（ポスター → 鳥 → 雲が開けて全体マップ） ---------- */
(function(){
  const el = document.getElementById('intro'); if (!el) return;
  // 最初に開いたときだけ流す。5分以内に見た人には流さない（再読み込み・アプリの切り替えで戻ったときなど）
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const deep = (location.hash||'').length>1 && location.hash!=='#map';
  let recent = false; try { recent = Date.now() - Number(localStorage.getItem('mutsuura-intro-at')||0) < 5*60*1000; } catch(e){}
  if (reduce || deep || recent) { el.remove(); return; }
  try { localStorage.setItem('mutsuura-intro-at', String(Date.now())); } catch(e){}
  el.querySelector('.i-poster').src = POSTER_SRC;
  // 鳥はポスターの中央から飛び立って、右上へ抜けていく
  const W = innerWidth, H = innerHeight;
  el.querySelector('.i-bird').style.offsetPath = `path('M ${W*0.42} ${H*0.5} C ${W*0.15} ${H*0.38}, ${W*0.7} ${H*0.42}, ${W*1.2} ${-H*0.1}')`;
  el.hidden = false;
  const end = () => { if (!el.isConnected) return; el.classList.add('done'); setTimeout(()=>el.remove(), 380); };
  // 夢の世界へ：星くず・魔法の粉・光のはじけ・地図がふわっと現れる
  const mk=(cls,html='')=>{ const d=document.createElement('div'); d.className=cls; d.innerHTML=html; return d; };
  const stars=mk('i-stars'); for(let k=0;k<46;k++){ const t=document.createElement('i'); t.style.left=(Math.random()*100)+'%'; t.style.top=(Math.random()*100)+'%'; t.style.animationDelay=(-Math.random()*2.4)+'s'; t.style.setProperty('--s',(0.5+Math.random()*1.2).toFixed(2)); stars.appendChild(t); }
  el.insertBefore(stars, el.querySelector('.i-poster'));
  el.insertBefore(mk('i-rays'), el.querySelector('.i-poster'));
  const trail=mk('i-trail'); const path=el.querySelector('.i-bird').style.offsetPath;

    let g = `<polygon points="${pts([[x+w,y,0],[x+w+30,y+30,0],[x+w+30,y+d+30,0],[x+30,y+d+30,0],[x,y+d,0]])}" fill="rgba(20,50,10,.18)"/>`;
    segs.forEach(([a,c],k)=>{

      const n = b.floors ? ALL.filter(i=>i.b.id===id && i.fi===k && matches(i)===true).length : 0;
      const cur = S.view==='floor' && S.b===id && S.fi===k;
      const left = pts([[x,y+d,z0],[x+w,y+d,z0],[x+w,y+d,z1],[x,y+d,z1]]);
      const right = pts([[x+w,y+d,z0],[x+w,y,z0],[x+w,y,z1],[x+w,y+d,z1]]);

        const rows = Math.max(1, Math.floor(d/70)); for(let q=0;q<rows;q++){ const yy = y + (q+0.5)*d/rows - 9; win += `<polygon points="${pts([[x+w,yy,z0+9],[x+w,yy+18,z0+9],[x+w,yy+18,z1-7],[x+w,yy,z1-7]])}" fill="#fff4cf" opacity=".75"/>`; }
      }

        `<polygon class="face" points="${left}" fill="${cur?'var(--gold)':P.l}" stroke="rgba(40,28,80,.4)" stroke-width="1.2" stroke-linejoin="round"/>`+
        `<polygon class="face" points="${right}" fill="${P.r}" stroke="rgba(40,28,80,.4)" stroke-width="1.2" stroke-linejoin="round"/>`+ win +
        (last? `<polygon class="face" points="${pts([[x,y,z1],[x+w,y,z1],[x+w,y+d,z1],[x,y+d,z1]])}" fill="${P.top}" stroke="rgba(40,28,80,.4)" stroke-width="1.2" stroke-linejoin="round"/>`:'')+
        (segs.length>1? (()=>{ const [lx,ly]=Pj(x+14,y+d,z0+FH/2); return `<rect x="${lx-2}" y="${ly-9}" width="26" height="17" rx="5" fill="#fff" opacity=".95"/><text x="${lx+11}" y="${ly+4}" text-anchor="middle" font-size="11">${b.floors[k].f}</text>`; })():'')+
        (n? (()=>{ const [qx,qy]=Pj(x+w,y+d/2,z0+FH/2); return `<circle cx="${qx+12}" cy="${qy}" r="10" fill="var(--sunset)" stroke="#fff" stroke-width="2"/><text x="${qx+12}" y="${qy+4}" text-anchor="middle" font-size="11" style="fill:#fff">${n}</text>`; })():'')+`</g>`;
    });
    if (id==='rei'){ const [cx,cy]=Pj(x+w/2,y+d/2,nf*FH); g += `<path d="M${cx} ${cy-44}v28M${cx-9} ${cy-35}h18" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M${cx} ${cy-44}v28M${cx-9} ${cy-35}h18" stroke="${P.r}" stroke-width="2" stroke-linecap="round"/>`; }
    const [tx,ty] = Pj(x+w/2, y+d/2, nf*FH); const bn = L(b.name); const lw = [...bn].reduce((t,ch)=>t+(/[\x00-\x7f]/.test(ch)?9:16),0)+24;
    g += `<g><rect x="${tx-lw/2}" y="${ty-14}" width="${lw}" height="26" rx="13" fill="#fff" stroke="rgba(40,28,80,.35)" stroke-width="1.5"/><text class="dl" x="${tx}" y="${ty+5}" text-anchor="middle" font-size="14">${bn}</text></g>`;

    s += `<g class="rise" style="--d:${bi}">${g}</g>`;
  });
  return s;
}

/* ---------- viewport / pan-zoom ---------- */
const vp = document.getElementById('vp'); let base=[0,0,1440,800];
const svgEl = () => vp.querySelector('svg');
function setVB(v){ S.vb=v; const s=svgEl(); if(s) s.setAttribute('viewBox', v.map(n=>n.toFixed(1)).join(' ')); placeMarkers(); }
function unit(){ const r = vp.getBoundingClientRect(); return Math.max(S.vb[2]/r.width, S.vb[3]/r.height); }
function toSvg(cx,cy){ const r=vp.getBoundingClientRect(); const u=unit(); const [x,y,w,h]=S.vb; return [x+w/2+(cx-r.left-r.width/2)*u, y+h/2+(cy-r.top-r.height/2)*u]; }
function zoomBy(f,px,py){ const [x,y,w,h]=S.vb; const nw=Math.min(base[2]*1.4,Math.max(base[2]/5,w*f)); const k=nw/w; px=px??x+w/2; py=py??y+h/2; setVB([px-(px-x)*k,py-(py-y)*k,w*k,h*k]); }
function focusOn(i){ const w=Math.max(i.w+600, base[2]*0.72), h=w*base[3]/base[2]; setVB([i.x+i.w/2-w/2, i.y+i.h/2-h/2, w, h]); }
/* ドラッグ・ピンチ中は viewBox を書き換えず、CSS の transform で動かす（スマホでもなめらか）。指を離したら確定 */
let G=null;
function gBegin(){
  if(G) return; const svg=svgEl(); if(!svg||!S.vb) return; const r=vp.getBoundingClientRect();
  G={vb0:[...S.vb], rw:r.width, rh:r.height, left:r.left, top:r.top, u0:Math.max(S.vb[2]/r.width,S.vb[3]/r.height), target:null, mks:[...vp.querySelectorAll('.mk')]};
  G.mks.forEach(el=>{ el._x0=el._sx; el._y0=el._sy; });
  svg.classList.remove('enter'); svg.style.transformOrigin='0 0'; svg.style.willChange='transform';
  try{ svg.pauseAnimations(); }catch(_){}
  stage.classList.add('moving');
}
const uOf = v => Math.max(v[2]/G.rw, v[3]/G.rh);
function toSvgV(cx,cy,v){ const u=uOf(v); return [v[0]+v[2]/2+(cx-G.left-G.rw/2)*u, v[1]+v[3]/2+(cy-G.top-G.rh/2)*u]; }
function gPreview(v){
  if(!G) return; G.target=v;
  const [x0,y0,w0,h0]=G.vb0, [x,y,w,h]=v; const u1=uOf(v), a=G.u0/u1;
  const tx=(-(x+w/2))/u1+G.rw/2 - a*((-(x0+w0/2))/G.u0+G.rw/2);
  const ty=(-(y+h/2))/u1+G.rh/2 - a*((-(y0+h0/2))/G.u0+G.rh/2);
  const svg=svgEl(); if(svg) svg.style.transform=`translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) scale(${a.toFixed(4)})`;
  for(const el of G.mks){ if(el._x0==null) continue; el.style.transform=`translate(${(a*el._x0+tx).toFixed(1)}px,${(a*el._y0+ty).toFixed(1)}px)`; }
}
function gEnd(){
  if(!G) return; const t=G.target; const svg=svgEl(); G=null;
  if(svg){ svg.style.transform=''; svg.style.willChange=''; try{ svg.unpauseAnimations(); }catch(_){} }
  stage.classList.remove('moving');
  if(t) setVB(t); else placeMarkers();
}
const clampW = w => Math.min(base[2]*1.4, Math.max(base[2]/5, w));
const ptrs=new Map(); let drag=null, moved=false, pinch=null;
vp.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); gBegin(); if(!G) return;
  const cur = G.target||G.vb0;
  if(ptrs.size===1){ drag={x:e.clientX,y:e.clientY,vb:[...cur],u:uOf(cur)}; moved=false; }
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1, vb:[...cur], c:toSvgV(mx,my,cur), mx, my}; drag=null; }
});
vp.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)||!G) return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size>=2&&pinch){
    const [a,b]=[...ptrs.values()]; moved=true;
    const k=pinch.d/(Math.hypot(a.x-b.x,a.y-b.y)||1); const [x,y,w,h]=pinch.vb;
    const kk=clampW(w*k)/w; const [px,py]=pinch.c;
    const v=[px-(px-x)*kk, py-(py-y)*kk, w*kk, h*kk];
    const u=uOf(v), mx=(a.x+b.x)/2, my=(a.y+b.y)/2; v[0]-=(mx-pinch.mx)*u; v[1]-=(my-pinch.my)*u;
    gPreview(v); hideHint(); return;
  }
  if(drag){
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(!moved&&Math.hypot(dx,dy)>6){ moved=true; vp.classList.add('drag'); try{vp.setPointerCapture(e.pointerId)}catch(_){}; hideHint(); }
    if(moved) gPreview([drag.vb[0]-dx*drag.u, drag.vb[1]-dy*drag.u, drag.vb[2], drag.vb[3]]);
  }
});
const up=e=>{
  ptrs.delete(e.pointerId);
  if(ptrs.size===1 && pinch && G){ pinch=null; const p=[...ptrs.values()][0]; const cur=G.target||G.vb0; drag={x:p.x,y:p.y,vb:[...cur],u:uOf(cur)}; }
  if(ptrs.size<2) pinch=null;
  if(!ptrs.size){ drag=null; vp.classList.remove('drag'); gEnd(); }
};
vp.addEventListener('pointerup',up); vp.addEventListener('pointercancel',up);
vp.addEventListener('wheel',e=>{e.preventDefault();const [px,py]=toSvg(e.clientX,e.clientY);zoomBy(e.deltaY>0?1.12:1/1.12,px,py);hideHint();},{passive:false});
document.getElementById('z-in').onclick=()=>zoomBy(1/1.3);
document.getElementById('z-out').onclick=()=>zoomBy(1.3);

vp.addEventListener('keydown',e=>{ const g=e.target.closest('[data-id],[data-go],[data-b]'); if((e.key==='Enter'||e.key===' ')&&g){e.preventDefault();activate(g);} });

const SINGLE = new Set(['rei']);            // 建物まるごと1つの企画として扱う（礼拝堂＝イベントステージ）
function campusPoint(i){ const mk = campusMarkers().find(m=>m.i && m.i.id===i.id); if (mk) return [mk.x, mk.y+30]; const c = CAMPUS[i.b.id] ? CB(i.b.id) : null; return c ? [c[0]+c[2]/2, c[1]+c[3]/2] : CP(700,400); }
function focusCampus(x,y,w){
  const r = vp.getBoundingClientRect(); const A = r.height/Math.max(r.width,1);
  w = w || (PORT ? 520 : isPhone()? 620 : 900); const h = w*A; setVB([x-w/2, y-h*(isPhone()?0.3:0.5), w, h]);

function goFloor(bid,fi){

  if (SINGLE.has(bid)){ const it = ALL.find(i=>i.b.id===bid && isEntry(i)); if (it) { select(it.id,{stay:false}); return; } }
  if (NO_FLOOR.has(bid)){ const was=S.view; S.view='campus'; S.sel=null; S.detail=null; render(was!=='campus'); focusCampus(...CP(700,400)); return; }

  panel.classList.add('dragging'); const H=panel.offsetHeight, top0=panel.parentElement.getBoundingClientRect().bottom-H;
  const t=Math.min(H-parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--peek')), Math.max(0, sh.start-top0+dy)); panel.style.transform=`translateY(${t}px)`; });

  sh=null; });

document.getElementById('q').addEventListener('blur',()=>{ setTimeout(()=>{ if(false && document.activeElement!==document.getElementById('q') && panel.dataset.s!=='hidden' && !S.q && !S.filter && !S.detail) setSheet('hidden'); }, 300); });

}
function renderPanel(){
  // スマホでは詳細は小さなカード＋詳細ページで見せるので、下のバーは常に一覧
  if(S.detail && !isPhone()){ pbody.innerHTML = detailHTML(byId[S.detail]); pbody.scrollTop=0; return; }
  const q=S.q.toLowerCase(); let pool, title;
  if(q){ pool=ALL.filter(i=>listable(i)||facKey(i)).filter(i=>[i.no,i.name,i.sub,i.org,i.room,i.desc,i.b.name,i.fl.f,catOf(i)&&CATS[catOf(i)].l,facKey(i)&&FACS[facKey(i)].l].filter(Boolean).join(' ').toLowerCase().includes(q)); title=`「${S.q}」の結果`; }
  else if(S.filter){ pool=ALL.filter(i=>matches(i)===true); title=S.filter==='fav'?'行きたいリスト':(CATS[S.filter]||FACS[S.filter]).l; }
  else { pool=ALL.filter(isEntry); title='アトラクション＆グルメ'; }
  const seen=new Set(); pool=pool.filter(i=>{ const fk=facKey(i); if(!fk||fk==='health'||fk==='trash')return true; const k=`${fk}|${i.b.id}|${i.fi}|${i.g||''}`; if(seen.has(k))return false; seen.add(k); return true; });
  let h = '';
  const posterHTML = (!q && !S.filter) ? `<div class="poster"><img src="${POSTER_SRC}" alt="六浦祭2026 ポスター AMBITIOUS"><div><h3>六浦祭</h3><p class="d">10月30日<small>(金)</small>・31日<small>(土)</small></p><p>9:00 – 16:00　関東学院六浦</p><span class="t" id="count2"></span></div></div>` : '';
  if (!isPhone()) h += posterHTML;
  h += `<div class="l-title"><h3>${esc(title)}</h3><span>${pool.length}件</span></div>`;
  if(!pool.length){ pbody.innerHTML = h+`<p class="empty">${S.filter==='fav'?'気になる企画を開いて「☆ 行きたい」を押すと、ここに集まります。':'見つかりませんでした。別のことばで探してみてください。'}</p>`; return; }
  const groups={}; const byB = q || (S.filter && FACS[S.filter]) || S.filter==='fav';
  pool.forEach(i=>{ const k = byB? i.b.id : (catOf(i)||'_'); (groups[k] ||= []).push(i); });
  const order = byB? BUILDINGS.map(b=>b.id) : [...Object.keys(CATS),'_'];
  order.filter(k=>groups[k]).forEach(k=>{
    const c = byB? cv(B(k).col) : CATS[k]?cv(CATS[k].v):'var(--muted)';
    const label = byB? B(k).name : CATS[k]?CATS[k].l:'施設';
    h += `<div class="sec" style="--c:${byB?'var(--ink)':c}">${esc(label)}</div><ul class="list">`;
    groups[k].sort((a,b)=>(a.no||999)-(b.no||999)).forEach(i=>{
      const nm = i.t==='tbd'?(i.room||'準備中の部屋'):i.name; const sub = i.t==='tbd'?'企画 準備中':i.sub||'';
      h += `<li><button class="it" data-id="${i.id}" ${S.sel===i.id?'aria-current="true"':''}>${numHTML(i)}<span class="nm">${esc(nm)}${i.org&&i.t!=='tbd'?`<span class="by">by ${esc(i.org)}</span>`:''}${sub?`<small>${esc(sub)}</small>`:''}</span><span class="loc">${S.favs.has(i.id)?'<span class="fav">★</span>':''}<b>${esc(i.b.name)}</b>${esc(i.fl.f)}</span></button></li>`;
    });
    h += `</ul>`;
  });
  if (isPhone() && posterHTML) h += `<div style="margin-top:18px">${posterHTML}</div>`;
  h += `<p class="note">「準備中」の部屋は、企画が決まり次第この地図に載ります。本館は六浦祭期間中は立入禁止です。4号館の食堂は当日は使えません。<br>地図 v70</p>`;
  pbody.innerHTML = h;
  { const sig=(S.q||'')+'|'+(S.filter||''); if (sig===S.listSig) pbody.querySelectorAll('.it').forEach(el=>el.style.animation='none'); S.listSig=sig; }
  const c2=document.getElementById('count2'); if(c2) c2.textContent=S.countText||'';
  if(LANG==='en') translateDom(pbody);
}

/* ---------- render ---------- */
const stage=document.getElementById('stage');
function render(reset){
  chips(); renderPanel();
  ['campus','3d','floor'].forEach(v=>document.getElementById('v-'+v).setAttribute('aria-pressed',S.view===v));
  const place=document.getElementById('place'), bt=document.getElementById('btabs'), rail=document.getElementById('rail');
  let inner, vb;
  if(S.view==='campus'){
    place.style.setProperty('--c','var(--sunset)');
    place.innerHTML=`<span class="sw" style="color:#fff">MAP</span><div><h2>六浦祭 ガイドマップ</h2><p>建物やテントをタップしてね</p></div>`;
    document.getElementById('mfloors').innerHTML='';
    bt.hidden=true; rail.innerHTML=''; PORT=isPortrait(); _lastPort=PORT; vb = PORT ? [0,-150,PW,PH+160] : [5,0,1430,900]; inner=campusSVG();
  } else if(S.view==='3d'){
    place.style.setProperty('--c','var(--see)');
    place.innerHTML=`<span class="sw" style="color:#fff">3D</span><div><h2>校舎を立体で見る</h2><p>階をタップするとその階へ</p></div>`;
    bt.hidden=true; rail.innerHTML=''; vb=[20,70,1060,760]; inner=isoSVG();
  } else {
    if (NO_FLOOR.has(S.b)) { S.b='jh'; S.fi=0; }
    const b=B(S.b), fl=b.floors[S.fi];
    // 階の切り替えボタン（パソコン：戻るボタンの横／スマホ：検索バーの下）
    const flb = b.floors.length>1 ? b.floors.map((f,k)=>{ const n=ALL.filter(i=>i.b.id===b.id&&i.fi===k&&matches(i)===true).length; return `<button class="flb" data-fi="${k}" aria-pressed="${k===S.fi}" aria-label="${f.f}">${f.f}${n?`<b>${n}</b>`:''}</button>`; }).join('') : '';
    rail.innerHTML = '';
    document.getElementById('mfloors').innerHTML = flb;
    place.style.setProperty('--c',cv(b.col));
    place.innerHTML=`<span class="sw">${esc(fl.f==='屋外'?'外':fl.f)}</span><div><h2>${esc(b.name)}</h2><p>${esc(b.sub)}</p></div>`;
    bt.hidden=false;
    bt.innerHTML=`<button class="backbtn" data-home="1"><span aria-hidden="true">←</span> 全体マップにもどる</button>`+(flb?`<span class="fsep" aria-hidden="true"></span>${flb}`:'');
    vb=fl.vb||[0,-40,1440,880]; inner=floorSVG(b,S.fi);
  }
  stage.classList.toggle('floor', S.view==='floor');
  { const mh=document.getElementById('mhere'), mt=document.getElementById('mtitle');
    if(S.view==='floor'){ const b=B(S.b), f=b.floors[S.fi]; mh.hidden=false; mh.style.setProperty('--c',cv(b.col));
      mt.innerHTML=`<i></i><b>${esc(L(b.name))}</b><span class="mt-f">${esc(f.f)}</span>`; }
    else mh.hidden=true; }
  const keep=!reset && S.vb && base.join()===vb.join(); base=vb;
  vp.innerHTML=`<svg class="map${S.view==='3d'?' iso':''}${reset?' enter':''}" viewBox="${(keep?S.vb:vb).join(' ')}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(place.textContent)}">${inner}</svg>`;
  if(!keep){
    S.vb=[...vb];
    // スマホ（縦長の画面）では、横長の地図が小さくなりすぎないよう少し拡大して始める
    if(isPhone() && S.view!=='3d'){
      const r=vp.getBoundingClientRect(); const A=r.height/Math.max(r.width,1);
      if (A>1.05) {
      const fl = S.view==='floor' ? B(S.b).floors[S.fi] : null;
      if (S.view==='campus' && PORT) { S.homeVB=[...S.vb]; } else {
      const c = S.view==='campus' ? [0,10,1440,890] : (fl.vb ? fl.vb : [fl.box[0]-20,fl.box[1]-20,fl.box[2]-fl.box[0]+40,fl.box[3]-fl.box[1]+40]);
      const w = c[2]*(S.view==='campus'?1.04:1), h = w*A;
      S.vb=[c[0]+c[2]/2-w/2, c[1]+c[3]/2-h/2 + h*(S.view==='campus'?0.02:0.04), w, h];
      S.homeVB=[...S.vb]; setVB(S.vb); }
    }
    }
  }
  if(!reset) vp.querySelectorAll('.pop,.rise').forEach(el=>el.style.animation='none');
  if(S.view==='campus'){ vp.insertAdjacentHTML('beforeend', `<div class="mks${reset?' anim':''}">${campusMarkers().map((m,k)=>markerHTML(m).replace(/^<(button|div) /, `<$1 data-i="${k}" `)).join('')}</div>`); }
  requestAnimationFrame(placeMarkers);
  renderMini();
  { const ms=document.querySelector('#msearch span'); if(ms){ ms.textContent = S.q ? '「'+S.q+'」' : S.filter ? L((CATS[S.filter]||{l:'行きたい'}).l)+'で絞り込み中' : L('企画・お店・トイレをさがす'); ms.style.color = (S.q||S.filter)?'var(--ink)':''; } }
  trAll();
  hashOut();
}
document.getElementById('btabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; if(b.dataset.fi!=null) goFloor(S.b,+b.dataset.fi); else goHome(); });
document.getElementById('mfloors').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) goFloor(S.b,+b.dataset.fi); });
document.getElementById('rail').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) goFloor(S.b,+b.dataset.fi); });
document.querySelector('.views').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; S.view=b.dataset.view; S.sel=null; S.detail=null; render(true); });

(function(){ const main=document.querySelector('.main'), t=document.getElementById('gtoggle');
  const set=c=>{ main.classList.toggle('collapsed',c); t.setAttribute('aria-expanded',!c); t.textContent=L(c?'◀ ガイドを開く':'ガイドを閉じる ▶'); try{localStorage.setItem('mutsuura-guide',c?'0':'1');}catch(e){} };

function openMenu(kind, anchor){
  if(!mmenu.hidden && mmenu.dataset.kind===kind){ mmenu.hidden=true; return; }
  mmenu.dataset.kind=kind; mmenu.classList.toggle('left', kind==='bld');
  if(kind==='view'){
    const V=[['campus','全体マップ','M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14'],['3d','3Dで見る','M12 2l9 5v10l-9 5-9-5V7zM3 7l9 5 9-5M12 12v10'],['floor','館内マップ','M12 3l9 4-9 4-9-4zM3 12l9 4 9-4M3 17l9 4 9-4']];
    mmenu.innerHTML='<h4>表示</h4>'+V.map(([v,l,d])=>`<button role="menuitem" data-view="${v}" aria-pressed="${S.view===v}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="${d}"/></svg>${l}</button>`).join('')+`<h4>${LANG==='en'?'Language':'言語'}</h4><button role="menuitem" data-lang="${LANG==='en'?'ja':'en'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>${LANG==='en'?'日本語':'English'}</button>`;
  } else {
    const r=anchor.getBoundingClientRect(), sr=stage.getBoundingClientRect(); mmenu.style.setProperty('--mt', (r.bottom-sr.top+8)+'px');
    mmenu.innerHTML='<h4>建物をえらぶ</h4>'+`<button role="menuitem" data-b="naka"><i style="--c:${cv(B('naka').col)}"></i>中庭 <small style="font-weight:700;color:var(--muted)">全体マップ</small></button>`+BUILDINGS.filter(b=>!NO_FLOOR.has(b.id)).map(b=>{ const m=ALL.filter(i=>i.b.id===b.id&&matches(i)===true).length; return `<button role="menuitem" data-b="${b.id}" aria-pressed="${S.view==='floor'&&S.b===b.id}"><i style="--c:${cv(b.col)}"></i>${b.name}${m?` <em style="font-style:normal;color:var(--sunset)">${m}</em>`:''}</button>`; }).join('');
  }
  mmenu.hidden=false; trAll();
}
document.getElementById('mlay').onclick=e=>{ e.stopPropagation(); openMenu('view', e.currentTarget); };
document.getElementById('mbld').onclick=e=>{ e.stopPropagation(); goHome(); };
mmenu.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; mmenu.hidden=true;
  if(b.dataset.lang){ setLang(b.dataset.lang); return; }
  if(b.dataset.view){ S.view=b.dataset.view; S.sel=null; S.detail=null; render(true); setSheet('peek'); }

document.addEventListener('click',e=>{ if(!mmenu.hidden && !e.target.closest('#mmenu,#mlay,#mbld')) mmenu.hidden=true; });
document.getElementById('mfit').onclick=()=>setVB([...(S.homeVB||base)]);
let _vpSize=null;
try{ new ResizeObserver(()=>{ const r=vp.getBoundingClientRect(); const prev=_vpSize; _vpSize=[r.width,r.height];
  if (r.width<10 || r.height<10) return;
  if (!prev || prev[0]<10 || prev[1]<10 || Math.abs(r.width/r.height - prev[0]/prev[1]) > 0.25) { if (!G) render(true); return; }
  placeMarkers(); }).observe(vp); }catch(e){ addEventListener('resize',placeMarkers); }
setSheet('hidden');

document.getElementById('home1').onclick=goHome; document.getElementById('home2').onclick=goHome;

const langbtn=document.getElementById('langbtn');

langbtn.onclick=()=>{ setLang(LANG==='en'?'ja':'en'); syncLangBtn(); };
syncLangBtn();
/* ---------- スマホ：店舗名だけの小さなカード → 押すと詳細ページ ---------- */
const mcard=document.getElementById('mcard'), dpage=document.getElementById('dpage');
function renderMini(){
  const i = S.detail && byId[S.detail];
  if (!isPhone() || !i){ mcard.hidden=true; return; }
  const nm = i.t==='tbd' ? (i.room||'準備中') : i.name;
  const c = itemColor(i);
  const ph = i.photo && i.t!=='tbd' ? `<img src="${esc(photoURL(i.photo,200))}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'mi-ic'}))">` : '';
  mcard.style.setProperty('--c', c);
  mcard.innerHTML = `<span class="mi-ph">${ph || `<svg viewBox="0 0 40 40"><use href="#${itemIcon(i)}"/></svg>`}${i.no?`<em>${i.no}</em>`:''}</span><span class="mi-t"><b>${esc(L(nm))}</b>${i.org&&i.t!=='tbd'?`<small>by ${esc(i.org)}</small>`:`<small>${esc(where(i))}</small>`}</span><span class="mi-go" aria-hidden="true">›</span>`;
  const was = mcard.hidden; mcard.hidden=false; if (was){ mcard.classList.remove('pop'); void mcard.offsetWidth; mcard.classList.add('pop'); }
}
mcard.addEventListener('click', ()=>{ const i=byId[S.detail]; if(i) openDetailPage(i); });
function openDetailPage(i){
  const cat=catOf(i), c=itemColor(i);
  const nm = i.t==='tbd' ? (i.room||'準備中') : i.name;
  const kind = cat?CATS[cat].l : facKey(i)?FACS[facKey(i)].l : i.t==='tbd'?'準備中':'施設';
  const desc = i.desc || (i.t==='tbd'?'この部屋の企画はまだ決まっていません。決まり次第この地図に載ります。':'');
  const rooms = i.links&&i.links.length ? [i,...i.links].map(x=>L(x.room||'')).filter(Boolean).join('＋') : (i.room&&i.t!=='tbd'?L(i.room):'');
  const fav=S.favs.has(i.id);
  dpage.style.setProperty('--c', c);
  dpage.innerHTML = `<div class="dp-scroll">
    <div class="dp-hero">${i.photo&&i.t!=='tbd'?`<img src="${esc(photoURL(i.photo,1200))}" alt="" onerror="this.remove()">`:''}<div class="dp-ic"><svg viewBox="0 0 40 40"><use href="#${itemIcon(i)}"/></svg></div>
      <button class="dp-x" id="dp-x" aria-label="閉じる">✕</button></div>
    <div class="dp-body">
      ${i.org&&i.t!=='tbd'?`<p class="dp-by">by ${esc(i.org)}</p>`:''}
      <p class="dp-where">${esc(L(i.b.name))}　${esc(L(i.fl.f))}${rooms?'　'+esc(rooms):''}</p>
      <h2 class="dp-name">${i.no?`<span class="dp-no">${i.no}</span>`:''}${esc(L(nm))}</h2>
      ${i.sub?`<p class="dp-sub">${esc(i.sub)}</p>`:''}
      <div class="dp-acts">
        <button class="dp-btn" id="dp-map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 20l5-2 8 3 5-2V5l-5 2-8-3-5 2z"/><path d="M8 4v14M16 7v14"/></svg><span>${LANG==='en'?'Map':'マップ'}</span></button>
        ${isEntry(i)?`<button class="dp-btn" id="dp-fav" aria-pressed="${fav}"><svg viewBox="0 0 40 40"><use href="#i-star"/></svg><span>${fav?(LANG==='en'?'Saved':'行きたい済み'):(LANG==='en'?'Want to go':'行きたい')}</span></button>`:''}
      </div>
      ${desc?`<p class="dp-desc">${esc(desc)}</p>`:''}
      <hr>
      <h3>${LANG==='en'?'Details':'情報'}</h3>
      <ul class="dp-tags">
        <li><b>${LANG==='en'?'Type':'ジャンル'}</b>${esc(L(kind))}</li>
        ${i.fee?`<li><b>${LANG==='en'?'Price':'料金'}</b>${i.fee==='free'?L('無料'):L('有料')}</li>`:''}
        <li><b>${LANG==='en'?'Place':'場所'}</b>${esc(L(i.b.name))} ${esc(L(i.fl.f))}${rooms?' · '+esc(rooms):''}</li>
        ${i.org?`<li><b>${LANG==='en'?'By':'団体'}</b>${esc(i.org)}</li>`:''}
      </ul>
    </div></div>`;
  dpage.hidden=false; requestAnimationFrame(()=>dpage.classList.add('on'));
  if (LANG==='en') translateDom(dpage);
}

let _lastPort=null;
addEventListener('resize', ()=>{ const p=isPortrait(); if (_lastPort!==null && p!==_lastPort && S.view==='campus') render(true); _lastPort=p; });
document.getElementById('msearch').addEventListener('click', openSearch);

countdown(); setInterval(()=>{ countdown(); const c2=document.getElementById('count2'); if(c2) c2.textContent=S.countText||''; },60000);
hashIn(); render(true);

pull();

// テスト用：キーボードの T で初期画面に戻って「ようこそ」をもう一度流す
addEventListener('keydown',e=>{ if((e.key==='t'||e.key==='T') && !e.ctrlKey && !e.metaKey && !e.altKey && !e.isComposing && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||'') && !(e.target&&e.target.isContentEditable)){
  try{ localStorage.removeItem('mutsuura-intro-at'); }catch(_){}
